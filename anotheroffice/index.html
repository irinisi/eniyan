<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Another Office</title>
  <meta name="description" content="A multidisciplinary company that develops travel products for non-professional travelers and weekend tourists." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #f6f4f0;
      color: #2a1008;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      position: relative;
      width: 100%;
      height: 100dvh;
      min-height: 600px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Hero photo — centered in upper ~75% */
    .hero {
      flex: 1;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 0;
    }

    .hero img {
      height: 72vh;
      max-height: 680px;
      width: auto;
      object-fit: contain;
      display: block;
      /* subtle drop shadow to lift figure off background */
      filter: drop-shadow(0 8px 32px rgba(40,10,0,0.08));
    }

    /* Bottom bar */
    .footer {
      padding: 28px 48px 36px;
      display: flex;
      align-items: flex-end;
      gap: 40px;
    }

    .logo img {
      height: clamp(28px, 3.4vw, 50px);
      width: auto;
      display: block;
      /* removes white background on light page bg */
      mix-blend-mode: multiply;
    }

    .tagline {
      font-size: 11px;
      line-height: 1.65;
      color: #6b5249;
      max-width: 220px;
      padding-bottom: 3px;
      letter-spacing: 0.01em;
    }

    /* Mobile */
    @media (max-width: 600px) {
      .footer {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
        padding: 20px 24px 32px;
      }

      .hero img {
        height: 58vh;
      }

      .logo img {
        height: 28px;
      }

      .tagline {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="hero">
      <img src="hero.webp" alt="Another Office" />
    </div>
    <footer class="footer">
      <div class="logo"><img src="logo.png" alt="Another Office" /></div>
      <p class="tagline">A multidisciplinary company that develops travel products for non-professional travelers and weekend tourists.</p>
    </footer>
  </div>
</body>
</html>
