<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Another Office</title>
  <meta name="description" content="A multidisciplinary company that develops travel products for non-professional travelers and weekend tourists." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #f6f4f0;
      color: #2a1008;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: 100%;
      height: 100dvh;
      min-height: 600px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Mobile top logo (hidden on desktop) */
    .logo-top {
      display: none;
    }

    /* Hero photo — centered */
    .hero {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero img {
      height: 60vh;
      max-height: 560px;
      width: auto;
      object-fit: contain;
      display: block;
      mix-blend-mode: multiply;
    }

    /* Bottom bar */
    .footer {
      padding: 24px 48px 36px;
      display: flex;
      align-items: flex-end;
      gap: 32px;
    }

    .logo img {
      height: clamp(24px, 2.8vw, 40px);
      width: auto;
      display: block;
      mix-blend-mode: multiply;
    }

    .tagline {
      font-size: 11px;
      line-height: 1.65;
      color: #6b5249;
      max-width: 170px;
      padding-bottom: 2px;
      letter-spacing: 0.01em;
    }

    /* Mobile */
    @media (max-width: 600px) {
      .logo-top {
        display: block;
        padding: 24px 24px 0;
        text-align: center;
      }

      .logo-top img {
        height: 26px;
        width: auto;
        mix-blend-mode: multiply;
      }

      .hero img {
        height: 58vh;
      }

      .footer {
        padding: 12px 24px 32px;
        justify-content: center;
      }

      .footer .logo {
        display: none;
      }

      .tagline {
        max-width: 100%;
        font-size: 11px;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="logo-top"><img src="logo.png" alt="Another Office" /></div>
    <div class="hero">
      <img src="hero.webp" alt="Another Office" />
    </div>
    <footer class="footer">
      <div class="logo"><img src="logo.png" alt="Another Office" /></div>
      <p class="tagline">A multidisciplinary company that develops travel products for non-professional travelers and weekend tourists.</p>
    </footer>
  </div>
</body>
</html>
