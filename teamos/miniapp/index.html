<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TeamOS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/preline@2.5.1/dist/preline.min.css" />
<link rel="stylesheet" href="style.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
</head>
<body>
  <main id="app"></main>

  <nav class="tabbar tos-surface fixed inset-x-0 bottom-0 flex border-t border-black/5 z-10">
    <button data-tab="home" class="active flex-1 flex flex-col items-center gap-0.5 py-2 text-xl text-[var(--button)]"><i data-lucide="home" class="size-5"></i><span class="text-[11px]">Главная</span></button>
    <button data-tab="tasks" class="flex-1 flex flex-col items-center gap-0.5 py-2 text-xl tos-hint"><i data-lucide="check-square" class="size-5"></i><span class="text-[11px]">Задачи</span></button>
    <button data-tab="projects" class="flex-1 flex flex-col items-center gap-0.5 py-2 text-xl tos-hint"><i data-lucide="folder" class="size-5"></i><span class="text-[11px]">Проекты</span></button>
    <button data-tab="knowledge" class="flex-1 flex flex-col items-center gap-0.5 py-2 text-xl tos-hint"><i data-lucide="book-open" class="size-5"></i><span class="text-[11px]">База знаний</span></button>
    <button data-tab="profile" class="flex-1 flex flex-col items-center gap-0.5 py-2 text-xl tos-hint"><i data-lucide="user" class="size-5"></i><span class="text-[11px]">Профиль</span></button>
  </nav>

  <script src="config.js?v=4"></script>
  <script src="api.js?v=4"></script>
  <script src="app.js?v=4"></script>
  <script src="https://cdn.jsdelivr.net/npm/preline@2.5.1/dist/preline.min.js"></script>
</body>
</html>
