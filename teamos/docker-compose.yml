services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../..:/repo
    environment:
      - TEAMOS_VAULT_PATH=/repo/teamos/vault
      - TEAMOS_GIT_REPO=/repo
    env_file: .env

  bot:
    build: ./bot
    restart: unless-stopped
    depends_on:
      - backend
    env_file: .env

  syncthing:
    image: syncthing/syncthing
    restart: unless-stopped
    environment:
      - PUID=0
      - PGID=0
    volumes:
      - ./vault:/var/syncthing/vault
      - syncthing-config:/var/syncthing/config
    ports:
      - "127.0.0.1:8384:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"

volumes:
  syncthing-config:
