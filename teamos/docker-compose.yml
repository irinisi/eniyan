services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./vault:/vault
    environment:
      - TEAMOS_VAULT_PATH=/vault
    env_file: .env

  bot:
    build: ./bot
    depends_on:
      - backend
    env_file: .env

  miniapp:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./miniapp:/usr/share/nginx/html:ro

  syncthing:
    image: syncthing/syncthing
    volumes:
      - ./vault:/var/syncthing/vault
      - syncthing-config:/var/syncthing/config
    ports:
      - "8384:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"

volumes:
  syncthing-config:
